name: Acceptance

on:
  push:
    branches: [main]
  pull_request:

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PHANTOM_DB_URL: jdbc:postgresql://127.0.0.1:5432/phantom_company
      PHANTOM_DB_USER: phantom_app
      PHANTOM_DB_PASSWORD: phantom_test_password

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: phantom_company
          POSTGRES_USER: phantom_app
          POSTGRES_PASSWORD: phantom_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U phantom_app -d phantom_company"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Verify backend and PostgreSQL acceptance
        working-directory: backend
        run: ./gradlew test acceptanceTest

      - name: Verify frontend build and lint
        working-directory: frontend
        run: npm run build && npm run lint

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run browser acceptance
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
